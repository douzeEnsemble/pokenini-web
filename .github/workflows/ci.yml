name: CI

on:
  push:
    branches:
      - main
  pull_request: ~

jobs:
  docker_compose:
    name: Docker Compose Checks
    runs-on: ubuntu-latest
    steps: &docker_compose_steps
      - name: Checkout
        uses: actions/checkout@v3
      - name: Pull images
        run: docker compose pull --ignore-pull-failures || true
      - name: Start services
        run: docker compose up --build -d
      - name: Wait for services
        run: |
          while status="$(docker inspect --format="{{if .Config.Healthcheck}}{{print .State.Health.Status}}{{end}}" "$(docker compose ps -q php)")"; do
            case $status in
              starting) sleep 1;;
              healthy) exit 0;;
              unhealthy)
                docker compose ps
                docker compose logs
                exit 1
              ;;
            esac
          done
          exit 1
      - name: Check HTTP reachability
        run: curl -v -o /dev/null http://localhost:8081
      - name: Check HTTPS reachability
        run: curl  -vk -o /dev/null https://localhost:4431

  phpcs:
    name: Quality PHPCS
    runs-on: ubuntu-latest
    steps:
      &docker_compose_steps
      - run: make phpcs

  phpmd:
    name: Quality PHPMD
    runs-on: ubuntu-latest
    steps:
      &docker_compose_steps
      - run: make phpmd

  psalm:
    name: Quality Psalm
    runs-on: ubuntu-latest
    steps:
      &docker_compose_steps
      - run: make psalm

  phpstan:
    name: Quality PHPStan
    runs-on: ubuntu-latest
    steps:
      &docker_compose_steps
      - run: make phpstan

  phpunit:
    name: Quality PHPUnit
    runs-on: ubuntu-latest
    steps:
      &docker_compose_steps
      - run: make phpunit
