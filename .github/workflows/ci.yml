name: CI

on:
  push:
    branches:
      - main
  pull_request: ~

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: renauddouze/pokenini-web:ci

  build_and_tests:
    name: All Checks (Quality & Tests & Integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: docker pull renauddouze/pokenini-web
      - name: Start services
        run: docker compose up --build -d
      - name: Quality PHPCS
        run: make phpcs
        continue-on-error: false
      - name: Quality PHPMD
        run: make phpmd
        continue-on-error: false
      - name: Quality Psalm
        run: make psalm
        continue-on-error: false
      - name: Tests PHPStan
        run: make phpstan
        continue-on-error: false
      - name: Tests PHPUnit
        run: make phpunit
        continue-on-error: false
