name: Docker Compose Pull Up And Check
description: Use to docker compose pull and up then checks if services are correctly running
author: Renaud Douze
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Pull images
      run: docker compose pull --ignore-pull-failures || true
    - name: Start services
      run: docker compose up --build -d
    - name: Wait for services
      run: |
        while status="$(docker inspect --format="{{if .Config.Healthcheck}}{{print .State.Health.Status}}{{end}}" "$(docker compose ps -q php)")"; do
          case $status in
            starting) sleep 1;;
            healthy) exit 0;;
            unhealthy)
              docker compose ps
              docker compose logs
              exit 1
            ;;
          esac
        done
        exit 1
    - name: Check HTTP reachability
      run: curl -v -o /dev/null http://localhost:8081
    - name: Check HTTPS reachability
      run: curl  -vk -o /dev/null https://localhost:4431