name: PHP prepare
description: Prepare the PHP env
author: Renaud Douze
runs:
  using: "composite"
  steps:
    - name: Copy .env file
      shell: bash
      run: cp .env.ci .env

    - name: Setup PHP
      uses: shivammathur/setup-php@fd40a155f071e5750f84893bd40a9db4be44f605 # verbose
      with:
        php-version: "8.5"
        extensions: apcu, ctype, dom, iconv, intl, json, libxml, mbstring, simplexml, tokenizer, xml, xmlwriter, zip
        tools: none
        coverage: none
