expose_php = 0
date.timezone = UTC
session.use_strict_mode = 1
zend.detect_unicode = 0
; Default image memory_limit (128M) isn't enough to render the largest album
; (Pokémon Home aggregates every transferable Pokémon across all games:
; ~1477 entries, each with a full detail modal, ~176M peak measured) -
; see var/screenshots audit, album-home Fatal error investigation.
memory_limit = 1024M
