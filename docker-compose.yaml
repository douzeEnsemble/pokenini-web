name: Pokénini Web

services:
  moco.back:
    build:
      context: ./.docker/moco
      args:
        MOCO_VERSION: ${MOCO_VERSION:-1.5.0}
    volumes:
      - ./tests/resources/moco/Back/:/var/moco:ro
    command: "/var/moco/moco.json"

  moco.matomo.gbl:
    build:
      context: ./.docker/moco
      args:
        MOCO_VERSION: ${MOCO_VERSION:-1.5.0}
    volumes:
      - ./tests/resources/moco/Matomo/:/var/moco:ro
    ports:
      - '127.0.0.1:8888:80'
    command: "/var/moco/moco.json"

  php:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile
      target: php_dev
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    volumes:
      - .:/app
    environment:
      - PHP_CS_FIXER_IGNORE_ENV=1
    tty: true
    depends_on:
      chrome:
        condition: service_healthy
      firefox:
        condition: service_healthy

  redis:
    image: redis:8.0-alpine
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-douze}
    restart: always

  chrome:
    image: selenium/standalone-chromium:4
    shm_size: '2g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  firefox:
    image: selenium/standalone-firefox:4
    shm_size: '2g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  web:
    image: nginx:1.28-alpine
    volumes:
      - .:/app
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    ports:
      - '127.0.0.1:80:8080'
      - '127.0.0.1:443:8080'
    depends_on:
      - php

volumes:
  redis_data:  
