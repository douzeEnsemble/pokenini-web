connect:
  disclaimer: |
    J'utilise la connexion uniquement pour l'identification (savoir qui tu es).
    L'email ne me sert à rien, je ne le regarde même pas.
    Je ne conserve aucune donnée autre que l'identifiant fourni par le service.

    Choisis ton service d'identification préféré.
    Tu seras redirigé vers leur site pour te connecter.
  help: |
    Chaque service te permet d'avoir un compte différent sur Pokénini.

