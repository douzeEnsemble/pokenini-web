        Je supporte que la connexion via Google. Si t'en veut d'autres, dis le moi

trainer:
    welcome: |
        Bonjour à toi jeune dresseur.
        Ceci est ton espace. 

        Bon l'instant tu peux pas y faire grand chose. 
        Mais ça viendra.
    personnal_data:
