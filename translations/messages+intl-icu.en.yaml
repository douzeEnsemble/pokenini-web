connect:
  disclaimer: |
    I use the connection solely for identification purposes.
    The email is of no use to me, so it doesn't matter.
    I do not retain ANY data other than the identifier provided by the provider.

    Choose your preferred identification service.
    You will be redirected to their site to log in.
  help: |
    Each service allows you to have a different account on Pokénini.

