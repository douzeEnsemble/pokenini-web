security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
  
  providers:
    users:
        id: App\Security\UserProvider

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    web:
      lazy: true
      provider: users
      logout:
        path: app_connect_logout
      entry_point: App\Security\AuthenticationEntryPoint
      custom_authenticators:
        - App\Security\DiscordAuthenticator
        - App\Security\GoogleAuthenticator
        - App\Security\E2eAuthenticator

  access_control:
    - { path: ^/(%app.locales_pattern%)/album/dex$, roles: ROLE_TRAINER }
    - { path: ^/(%app.locales_pattern%)/album, roles: PUBLIC_ACCESS }
    - { path: ^/(%app.locales_pattern%)/connect, roles: PUBLIC_ACCESS }
    - { path: ^/(%app.locales_pattern%)/istration, roles: ROLE_ADMIN }
    - { path: ^/(%app.locales_pattern%)/trainer, roles: ROLE_TRAINER }
    - { path: ^/(%app.locales_pattern%)/election, roles: ROLE_TRAINER }
    - { path: ^/(%app.locales_pattern%)/game, roles: ROLE_TRAINER }
    - { path: ^/(%app.locales_pattern%)/hub/highlights, roles: ROLE_TRAINER }
    - { path: ^/(%app.locales_pattern%)/outerroom, roles: ROLE_USER }
    - { path: ^/, roles: PUBLIC_ACCESS }

when@dev: &fake_authenticator
  security:
    firewalls:
      web:
        custom_authenticators:
          - App\Security\FakeAuthenticator
          - App\Security\E2eAuthenticator

when@test: *fake_authenticator
