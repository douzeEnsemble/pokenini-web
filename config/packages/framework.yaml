framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    
    handle_all_throwables: true
    enabled_locales: ['en', 'fr']

    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_hosts: '%env(TRUSTED_HOSTS)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']
    php_errors:
        log: true

    session:
        handler_id: '%env(REDIS_DSN)%'
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        cookie_lifetime: "%env(SESSION_TTL)%"
        gc_maxlifetime: "%env(SESSION_TTL)%"

    # Each release changes the CSS and JS URLs, so browsers do not keep the previous files
    assets:
        version: '%env(trim:file:default:app.version_file:APP_VERSION_FILE)%'
        version_format: '%%s?v=%%s'

    property_info:
        enabled: false
        with_constructor_extractor: false

when@dev:
    framework:
        test: true
        session:
            handler_id: ~

when@test:
    framework:
        test: true
        session:
            handler_id: ~
            storage_factory_id: session.storage.factory.mock_file
