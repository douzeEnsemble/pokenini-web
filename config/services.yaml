parameters:
  # Enabled locales, in display order: the only place to list them (framework, routes and security use it)
  app.locales: ["en", "fr"]
  # The same locales as a route requirement, to keep in sync with the list above
  app.locales_pattern: "en|fr"
  # Used when a name is missing in the current locale
  app.fallback_locale: "en"
  # The images of the shiny game are fetched by the server, as their URL gives the answer
  shiny_game.image_url: "%env(POKEMON_IMAGE_URL)%"
  # Written by the CI at release time, its content versions the CSS and JS URLs
  app.version_file: "%kernel.project_dir%/resources/metadata/version"

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      string $projectDir: "%kernel.project_dir%"
      string $backUrl: "%env(BACK_URL)%"
      string $backCafilePath: "%env(BACK_CAFILE_PATH)%"
      string $demoUserId: "%env(DEMO_USER_ID)%"
      string $resourcesVersionUrl: "%env(RESOURCES_VERSION_URL)%"
      string $gameImageUrl: "%shiny_game.image_url%"

  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

when@test:
  parameters:
    shiny_game.image_url: "http://moco.back/pokemon/big/%%1$s/%%2$s.png"
  services:
    # The session is mocked by the functional tests only (see phpunit.xml.dist), not by the server of the browser tests
    test.session.storage.factory:
      class: App\Tests\Utils\SwitchableSessionStorageFactory
      arguments:
        $native: "@session.storage.factory.native"
        $mock: "@session.storage.factory.mock_file"
        $useMock: "%env(bool:SESSION_MOCK)%"
