parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind: 
            string $appApiUrl: '%env(APP_API_URL)%'
            string $projectDir: '%kernel.project_dir%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\EventListener\ResponseListener:
        tags:
            - { name: kernel.event_listener, event: kernel.response }
