parameters:
  # The images of the shiny game are fetched by the server, as their URL gives the answer
  shiny_game.image_url: "%env(POKEMON_IMAGE_URL)%"

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      string $projectDir: "%kernel.project_dir%"
      string $backUrl: "%env(BACK_URL)%"
      string $backCafilePath: "%env(BACK_CAFILE_PATH)%"
      string $demoUserId: "%env(DEMO_USER_ID)%"
      string $resourcesVersionUrl: "%env(RESOURCES_VERSION_URL)%"
      string $gameImageUrl: "%shiny_game.image_url%"

  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

when@test:
  parameters:
    shiny_game.image_url: "http://moco.back/pokemon/big/%%1$s/%%2$s.png"
