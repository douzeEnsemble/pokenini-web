services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      string $backUrl: "%env(BACK_URL)%"
      string $backCafilePath: "%env(BACK_CAFILE_PATH)%"

  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"
