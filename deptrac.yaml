parameters:
  paths:
    - ./src
  exclude_files:
    - .*test.*
  layers:    
    - name: AppAlbumFilters
      collectors:
        - type: classLike
          value: '^App\\AlbumFilters\\.*'
    - name: AppController
      collectors:
        - type: classLike
          value: '^App\\Controller\\.*'
    - name: AppDTO
      collectors:
        - type: classLike
          value: '^App\\DTO\\.*'
    - name: AppException
      collectors:
        - type: classLike
          value: '^App\\Exception\\.*'
    - name: AppHelper
      collectors:
        - type: classLike
          value: '^App\\Helper\\.*'
    - name: AppResponseObject
      collectors:
        - type: classLike
          value: '^App\\ResponseObject\\.*'
    - name: AppSecurity
      collectors:
        - type: classLike
          value: '^App\\Security\\.*'
    - name: AppService
      collectors:
        - type: classLike
          value: '^App\\Service\\.*'
    - name: AppTwig
      collectors:
        - type: classLike
          value: '^App\\Twig\\.*'
    - name: AppUtils
      collectors:
        - type: classLike
          value: '^App\\Utils\\.*'
    - name: AppValidator
      collectors:
        - type: classLike
          value: '^App\\Validator\\.*'

    # KnpU
    - name: KnpUOAuth2ClientBundle
      collectors:
        - type: classLike
          value: '^KnpU\\OAuth2ClientBundle\\.*'

    # League
    - name: LeagueOAuth2
      collectors:
        - type: classLike
          value: '^League\\OAuth2\\.*'

    # Logger
    - name: Logger
      collectors:
        - type: classLike
          value: '^Psr\\Log\\LoggerInterface'

    # Symfony
    - name: SymfonyContractsHttpClient
      collectors:
        - type: classLike
          value: '^Symfony\\Contracts\\HttpClient\\.*'
    - name: SymfonyContractsTranslation
      collectors:
        - type: classLike
          value: '^Symfony\\Contracts\\Translation\\.*'
    - name: SymfonyFrameworkBundle
      collectors:
        - type: classLike
          value: '^Symfony\\Bundle\\FrameworkBundle\\.*'
    - name: SymfonyHttpException
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\HttpKernel\\Exception\\.*'
    - name: SymfonyHttpFoundation
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\HttpFoundation\\.*'
    - name: SymfonyOptionsResolver
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\OptionsResolver\\.*'
    - name: SymfonyRouting
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\Routing\\.*'
    - name: SymfonySecurity
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\Security\\.*'
    - name: SymfonySecurityBundle
      collectors:
        - type: classLike
          value: '^Symfony\\Bundle\\SecurityBundle\\.*'
    - name: SymfonySerializer
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\Serializer\\.*'
    - name: SymfonyValidator
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\Validator\\.*'

    # Twig
    - name: Twig
      collectors:
        - type: classLike
          value: '^Twig\\.*'

  ruleset:
    AppAlbumFilters:
      - AppAlbumFilters
      - SymfonyHttpFoundation
    AppController: 
      - AppAlbumFilters
      - AppDTO
      - AppException
      - AppSecurity
      - AppService
      - AppValidator
      - KnpUOAuth2ClientBundle
      - Logger
      - SymfonyFrameworkBundle
      - SymfonyHttpException
      - SymfonyHttpFoundation
      - SymfonyRouting
      - SymfonySecurity
      - SymfonyValidator
    AppDTO:
      - AppDTO
      - AppHelper
      - SymfonyHttpFoundation
      - SymfonyOptionsResolver
    AppException:
    AppHelper:
    AppResponseObject:
    AppSecurity:
      - AppDTO
      - AppException
      - AppService
      - KnpUOAuth2ClientBundle
      - LeagueOAuth2
      - SymfonyHttpFoundation
      - SymfonyRouting
      - SymfonySecurity
      - SymfonySecurityBundle
    AppService:
      - AppCache
      - AppDTO
      - AppException
      - AppResponseObject
      - AppSecurity
      - AppUtils
      - LeagueOAuth2
      - Logger
      - SymfonyContractsHttpClient
      - SymfonyHttpFoundation
      - SymfonySecurityBundle
      - SymfonySerializer
      - SymfonyValidator
    AppTwig:
      - SymfonyContractsTranslation
      - Twig
    AppUtils:
    AppValidator:
      - AppService
      - AppValidator
      - SymfonyValidator