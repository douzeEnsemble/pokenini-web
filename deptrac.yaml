parameters:
  paths:
    - ./src
  exclude_files:
    - .*test.*
  layers:    
    - name: AlbumFilters
      collectors:
        - type: classLike
          value: 'App\\AlbumFilters\\.*'
    - name: Controller
      collectors:
        - type: classLike
          value: 'App\\Controller\\.*'
    - name: DTO
      collectors:
        - type: classLike
          value: 'App\\DTO\\.*'
    - name: Exception
      collectors:
        - type: classLike
          value: 'App\\Exception\\.*'
    - name: Helper
      collectors:
        - type: classLike
          value: 'App\\Helper\\.*'
    - name: Security
      collectors:
        - type: classLike
          value: 'App\\Security\\.*'
    - name: Service
      collectors:
        - type: classLike
          value: 'App\\Service\\.*'
    - name: Twig
      collectors:
        - type: classLike
          value: 'App\\Twig\\.*'
    - name: Utils
      collectors:
        - type: classLike
          value: 'App\\Utils\\.*'
    - name: Validator
      collectors:
        - type: classLike
          value: 'App\\Validator\\.*'

  ruleset:
    AlbumFilters:
      - AlbumFilters
    Cache:
      - Service
    Controller: 
      - AlbumFilters
      - DTO
      - Exception
      - Security
      - Service
      - Validator
    DTO:
      - DTO
      - Helper
    Security:
      - Exception
      - Service
    Service:
      - Cache
      - DTO
      - Exception
      - Security
      - Utils
    Validator:
      - Service
      - Validator